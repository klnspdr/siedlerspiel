<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DB Editor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d0f11;
    --surface:   #141618;
    --border:    #252830;
    --border-hi: #3a3f4a;
    --text:      #c8cdd8;
    --text-dim:  #5a6070;
    --text-hi:   #eef0f5;
    --accent:    #e8c84a;
    --accent-dim:#7a6820;
    --danger:    #e05050;
    --danger-dim:#5a1a1a;
    --ok:        #50c878;
    --ok-dim:    #1a4a28;
    --new:       #5ab4e0;
    --new-dim:   #1a3a50;
    --dirty:     rgba(232,200,74,0.08);
    --font-mono: 'JetBrains Mono', 'Fira Mono', monospace;
    --font-ui:   'Syne', sans-serif;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-mono); font-size: 13px; line-height: 1.5; }

  /* ── Layout ── */
  #app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 48px 1fr; height: 100vh; overflow: hidden; }

  /* ── Header ── */
  header {
    grid-column: 1 / -1;
    display: flex; align-items: center; gap: 12px;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-family: var(--font-ui);
  }
  header .logo { font-size: 15px; font-weight: 800; letter-spacing: 0.12em; color: var(--accent); text-transform: uppercase; }
  header .sub  { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  header .spacer { flex: 1; }
  header .db-path { font-size: 10px; font-family: var(--font-mono); color: var(--text-dim); background: var(--bg); border: 1px solid var(--border); padding: 3px 8px; border-radius: 3px; }

  /* ── Sidebar ── */
  #sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 0;
  }
  .sidebar-label { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-dim); padding: 0 16px 8px; font-family: var(--font-ui); font-weight: 700; }
  .table-item {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 16px; cursor: pointer; color: var(--text-dim);
    border-left: 2px solid transparent;
    transition: color 0.1s, background 0.1s;
    font-size: 12px;
  }
  .table-item:hover  { color: var(--text); background: rgba(255,255,255,0.03); }
  .table-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(232,200,74,0.05); }
  .table-item .tname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .table-item .tcount { font-size: 10px; background: var(--border); color: var(--text-dim); padding: 1px 5px; border-radius: 2px; }
  .table-item.active .tcount { background: var(--accent-dim); color: var(--accent); }
  #sidebar-empty { padding: 16px; font-size: 11px; color: var(--text-dim); }

  /* ── Main ── */
  #main {
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  /* Toolbar */
  #toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  #toolbar .tbl-name { font-family: var(--font-ui); font-size: 14px; font-weight: 700; color: var(--text-hi); }
  #toolbar .tbl-name span { color: var(--text-dim); font-weight: 400; font-size: 11px; margin-left: 8px; }
  #toolbar .spacer { flex: 1; }

  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 5px 12px; border-radius: 3px; border: 1px solid;
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    cursor: pointer; transition: all 0.12s; white-space: nowrap; letter-spacing: 0.03em;
  }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-primary  { background: var(--accent); border-color: var(--accent); color: #000; }
  .btn-primary:hover:not(:disabled) { background: #f0d460; border-color: #f0d460; }
  .btn-danger   { background: transparent; border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover:not(:disabled)  { background: var(--danger-dim); }
  .btn-ghost    { background: transparent; border-color: var(--border-hi); color: var(--text); }
  .btn-ghost:hover:not(:disabled)   { border-color: var(--text-dim); background: rgba(255,255,255,0.04); }
  .btn-new      { background: transparent; border-color: var(--new); color: var(--new); }
  .btn-new:hover:not(:disabled)     { background: var(--new-dim); }

  /* Badge */
  .badge {
    display: inline-block; padding: 2px 6px; border-radius: 2px;
    font-size: 10px; font-weight: 500;
  }
  #dirty-count { background: var(--accent-dim); color: var(--accent); }
  #dirty-count.hidden { display: none; }

  /* Toast */
  #toast {
    position: fixed; bottom: 20px; right: 20px; z-index: 999;
    padding: 10px 16px; border-radius: 4px; font-size: 12px;
    border: 1px solid; opacity: 0; pointer-events: none;
    transition: opacity 0.2s;
    font-family: var(--font-mono);
  }
  #toast.show { opacity: 1; pointer-events: auto; }
  #toast.ok    { background: var(--ok-dim); border-color: var(--ok); color: var(--ok); }
  #toast.error { background: var(--danger-dim); border-color: var(--danger); color: var(--danger); }

  /* Table area */
  #table-wrap { flex: 1; overflow: auto; }

  #placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; gap: 10px; color: var(--text-dim);
  }
  #placeholder .big { font-size: 40px; }
  #placeholder p { font-size: 12px; }

  /* ── Data Table ── */
  table.grid {
    width: 100%; border-collapse: collapse;
    font-size: 12px;
  }
  table.grid thead th {
    position: sticky; top: 0; z-index: 2;
    background: #1a1c20;
    color: var(--text-dim); font-weight: 500;
    text-align: left; padding: 7px 10px;
    border-bottom: 1px solid var(--border);
    border-right: 1px solid var(--border);
    white-space: nowrap;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    user-select: none;
  }
  table.grid thead th.col-actions { width: 80px; text-align: center; }
  table.grid tbody tr { border-bottom: 1px solid var(--border); }
  table.grid tbody tr:hover { background: rgba(255,255,255,0.02); }
  table.grid tbody tr.dirty-row { background: var(--dirty); }
  table.grid tbody tr.new-row td { border-left: 2px solid var(--new); }
  table.grid tbody tr.deleting-row { opacity: 0.4; text-decoration: line-through; }

  table.grid td {
    padding: 0; border-right: 1px solid var(--border);
    vertical-align: middle;
  }
  table.grid td.rowid-cell {
    padding: 6px 10px; color: var(--text-dim); font-size: 10px;
    user-select: none; white-space: nowrap;
    background: rgba(0,0,0,0.1);
    width: 60px;
  }
  table.grid td.actions-cell { text-align: center; padding: 4px 6px; width: 80px; }

  /* Editable cell input */
  .cell-input {
    width: 100%; min-width: 60px;
    background: transparent; border: none; outline: none;
    color: var(--text-hi); font-family: var(--font-mono); font-size: 12px;
    padding: 6px 10px;
    display: block;
  }
  .cell-input:focus { background: rgba(232,200,74,0.06); }
  .cell-input.null-val { color: var(--text-dim); font-style: italic; }

  /* Row action btns */
  .row-del {
    background: transparent; border: none; cursor: pointer;
    color: var(--text-dim); font-size: 14px; padding: 3px 6px; border-radius: 2px;
    transition: color 0.1s, background 0.1s; font-family: var(--font-mono);
  }
  .row-del:hover { color: var(--danger); background: var(--danger-dim); }

  /* Loading spinner */
  #loading {
    display: none; align-items: center; justify-content: center;
    height: 100%; gap: 10px; color: var(--text-dim); font-size: 12px;
  }
  #loading.show { display: flex; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Add Row Modal ── */
  #modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
  }
  #modal-overlay.show { display: flex; }
  #modal {
    background: var(--surface); border: 1px solid var(--border-hi);
    border-radius: 6px; width: min(480px, 95vw);
    overflow: hidden;
  }
  #modal-header {
    display: flex; align-items: center; padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-family: var(--font-ui); font-weight: 700; font-size: 14px; color: var(--text-hi);
  }
  #modal-header .spacer { flex: 1; }
  #modal-header button { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 16px; }
  #modal-header button:hover { color: var(--text); }
  #modal-body { padding: 18px; display: flex; flex-direction: column; gap: 10px; max-height: 60vh; overflow-y: auto; }
  .field-row { display: flex; flex-direction: column; gap: 4px; }
  .field-row label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text-dim); }
  .field-row input {
    background: var(--bg); border: 1px solid var(--border); border-radius: 3px;
    color: var(--text-hi); font-family: var(--font-mono); font-size: 12px;
    padding: 7px 10px; outline: none; transition: border-color 0.1s;
  }
  .field-row input:focus { border-color: var(--accent); }
  #modal-footer { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 18px; border-top: 1px solid var(--border); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
</style>
</head>
<body>

<div id="app">
  <header>
    <div>
      <div class="logo">⬡ DB Editor</div>
      <div class="sub">Siedlerspiel · SQLite</div>
    </div>
    <div class="spacer"></div>
    <div class="db-path">game.db</div>
  </header>

  <nav id="sidebar">
    <div class="sidebar-label">Tables</div>
    <div id="table-list"><div id="sidebar-empty">Loading…</div></div>
  </nav>

  <main id="main">
    <div id="toolbar">
      <div id="toolbar-title" class="tbl-name" style="color:var(--text-dim);font-size:12px;">Select a table</div>
      <div class="spacer"></div>
      <span id="dirty-count" class="badge hidden">0 unsaved</span>
      <button class="btn btn-new" id="btn-add" disabled onclick="openAddModal()">＋ Add Row</button>
      <button class="btn btn-ghost" id="btn-discard" disabled onclick="discardChanges()">Discard</button>
      <button class="btn btn-primary" id="btn-save" disabled onclick="saveChanges()">Save Changes</button>
    </div>

    <div id="loading"><div class="spinner"></div> Loading table…</div>
    <div id="placeholder">
      <div class="big">◈</div>
      <p>Select a table from the sidebar</p>
    </div>
    <div id="table-wrap" style="display:none">
      <table class="grid" id="data-table">
        <thead id="thead"></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </main>
</div>

<!-- Add Row Modal -->
<div id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div id="modal">
    <div id="modal-header">
      Add New Row
      <div class="spacer"></div>
      <button onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
    <div id="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-new" onclick="submitAddRow()">Insert Row</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
'use strict';

// ── State ─────────────────────────────────────────────────────────────────────
let currentTable = null;
let columns = [];            // [{ name, type, pk, notnull }]
let allRows = [];            // raw data from server (with _rowid_)
let dirtyMap = new Map();    // rowid → { col: newVal, ... }
let pendingDeletes = new Set(); // rowid of rows staged for delete
let pendingInserts = [];     // [{ tempId, data }] — new rows not yet saved

let tempIdCounter = -1;      // negative ids for unsaved rows

// ── Init ──────────────────────────────────────────────────────────────────────
loadTableList();

async function loadTableList() {
  const r = await apiFetch('/db-api/tables');
  const list = document.getElementById('table-list');
  if (!r.tables || r.tables.length === 0) {
    list.innerHTML = '<div id="sidebar-empty" style="padding:16px;font-size:11px;color:var(--text-dim)">No tables found.<br>Run /ajax/initDB first.</div>';
    return;
  }
  list.innerHTML = '';
  for (const t of r.tables) {
    const item = document.createElement('div');
    item.className = 'table-item';
    item.dataset.table = t;
    item.innerHTML = `<span class="tname">${esc(t)}</span><span class="tcount">…</span>`;
    item.addEventListener('click', () => selectTable(t));
    list.appendChild(item);
  }
  // Load counts
  for (const t of r.tables) {
    fetchCount(t);
  }
}

async function fetchCount(table) {
  const r = await apiFetch(`/db-api/tables/${encodeURIComponent(table)}`);
  const el = document.querySelector(`.table-item[data-table="${table}"] .tcount`);
  if (el && r.rows) el.textContent = r.rows.length;
}

// ── Select table ──────────────────────────────────────────────────────────────
async function selectTable(table) {
  if (dirtyMap.size > 0 || pendingDeletes.size > 0 || pendingInserts.length > 0) {
    if (!confirm('You have unsaved changes. Discard and switch table?')) return;
  }
  currentTable = table;
  dirtyMap.clear();
  pendingDeletes.clear();
  pendingInserts = [];

  document.querySelectorAll('.table-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.table-item[data-table="${table}"]`)?.classList.add('active');

  showLoading(true);
  const r = await apiFetch(`/db-api/tables/${encodeURIComponent(table)}`);
  showLoading(false);

  if (r.error) { showToast(r.error, 'error'); return; }

  columns = r.columns;
  allRows = r.rows;
  renderTable();
  updateToolbar();
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderTable() {
  document.getElementById('placeholder').style.display = 'none';
  document.getElementById('table-wrap').style.display = '';

  // Header
  const thead = document.getElementById('thead');
  thead.innerHTML = '';
  const tr = document.createElement('tr');
  tr.innerHTML = `<th style="width:60px">#rowid</th>`;
  for (const col of columns) {
    const th = document.createElement('th');
    const pk = col.pk ? ' 🔑' : '';
    th.innerHTML = `${esc(col.name)}<br><span style="font-size:9px;opacity:.5">${esc(col.type||'ANY')}${pk}</span>`;
    tr.appendChild(th);
  }
  tr.innerHTML += `<th class="col-actions">ACTIONS</th>`;
  thead.appendChild(tr);

  // Body
  rebuildBody();
}

function rebuildBody() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  // Existing rows
  for (const row of allRows) {
    const rowid = row._rowid_;
    const isDeleting = pendingDeletes.has(rowid);
    const isDirty = dirtyMap.has(rowid);
    const tr = document.createElement('tr');
    tr.dataset.rowid = rowid;
    tr.className = [isDeleting ? 'deleting-row' : '', isDirty ? 'dirty-row' : ''].join(' ').trim();

    tr.innerHTML = `<td class="rowid-cell">${rowid}</td>`;
    for (const col of columns) {
      const td = document.createElement('td');
      const dirty = dirtyMap.get(rowid) || {};
      const val = col.name in dirty ? dirty[col.name] : row[col.name];
      const input = makeInput(val, col, rowid, false);
      td.appendChild(input);
      tr.appendChild(td);
    }
    // Delete btn
    const act = document.createElement('td');
    act.className = 'actions-cell';
    const delBtn = document.createElement('button');
    delBtn.className = 'row-del';
    delBtn.title = isDeleting ? 'Undo delete' : 'Delete row';
    delBtn.textContent = isDeleting ? '↩' : '✕';
    delBtn.onclick = () => toggleDelete(rowid, tr, delBtn);
    act.appendChild(delBtn);
    tr.appendChild(act);

    tbody.appendChild(tr);
  }

  // Pending inserts
  for (const ins of pendingInserts) {
    const tr = document.createElement('tr');
    tr.dataset.tempId = ins.tempId;
    tr.className = 'new-row';

    tr.innerHTML = `<td class="rowid-cell" style="color:var(--new);font-style:italic">new</td>`;
    for (const col of columns) {
      const td = document.createElement('td');
      const input = makeInput(ins.data[col.name] ?? '', col, null, true, ins.tempId);
      td.appendChild(input);
      tr.appendChild(td);
    }
    const act = document.createElement('td');
    act.className = 'actions-cell';
    const delBtn = document.createElement('button');
    delBtn.className = 'row-del';
    delBtn.title = 'Remove new row';
    delBtn.textContent = '✕';
    delBtn.onclick = () => {
      pendingInserts = pendingInserts.filter(i => i.tempId !== ins.tempId);
      tr.remove();
      updateDirtyBadge();
    };
    act.appendChild(delBtn);
    tr.appendChild(act);
    tbody.appendChild(tr);
  }
}

function makeInput(val, col, rowid, isNew, tempId) {
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'cell-input' + (val === null ? ' null-val' : '');
  input.value = val === null ? 'NULL' : String(val);
  input.placeholder = col.dflt_value !== null ? `default: ${col.dflt_value}` : 'NULL';

  input.addEventListener('focus', () => { if (input.value === 'NULL' && val === null) input.value = ''; });

  input.addEventListener('input', () => {
    input.classList.remove('null-val');
    if (isNew) {
      const ins = pendingInserts.find(i => i.tempId === tempId);
      if (ins) ins.data[col.name] = input.value;
    } else {
      if (!dirtyMap.has(rowid)) dirtyMap.set(rowid, {});
      const curRow = allRows.find(r => r._rowid_ === rowid);
      const originalVal = curRow ? curRow[col.name] : undefined;
      const newVal = input.value === 'NULL' ? null : input.value;
      if (String(newVal) === String(originalVal)) {
        delete dirtyMap.get(rowid)[col.name];
        if (Object.keys(dirtyMap.get(rowid)).length === 0) dirtyMap.delete(rowid);
      } else {
        dirtyMap.get(rowid)[col.name] = newVal;
      }
      const tr = input.closest('tr');
      if (tr) tr.className = dirtyMap.has(rowid) ? 'dirty-row' : '';
    }
    updateDirtyBadge();
  });
  return input;
}

function toggleDelete(rowid, tr, btn) {
  if (pendingDeletes.has(rowid)) {
    pendingDeletes.delete(rowid);
    tr.classList.remove('deleting-row');
    btn.textContent = '✕';
    btn.title = 'Delete row';
  } else {
    pendingDeletes.add(rowid);
    tr.classList.add('deleting-row');
    btn.textContent = '↩';
    btn.title = 'Undo delete';
  }
  updateDirtyBadge();
}

// ── Save ──────────────────────────────────────────────────────────────────────
async function saveChanges() {
  if (!currentTable) return;
  const btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.textContent = 'Saving…';

  const errors = [];

  // 1. Deletes
  for (const rowid of pendingDeletes) {
    const r = await apiFetch(`/db-api/tables/${encodeURIComponent(currentTable)}/${rowid}`, 'DELETE');
    if (r.error) errors.push(`Delete rowid ${rowid}: ${r.error}`);
  }

  // 2. Updates
  for (const [rowid, changes] of dirtyMap) {
    if (pendingDeletes.has(rowid)) continue; // already deleted
    const r = await apiFetch(`/db-api/tables/${encodeURIComponent(currentTable)}/${rowid}`, 'PUT', changes);
    if (r.error) errors.push(`Update rowid ${rowid}: ${r.error}`);
  }

  // 3. Inserts
  for (const ins of pendingInserts) {
    const payload = {};
    for (const col of columns) {
      const v = ins.data[col.name];
      if (v !== '' && v !== undefined) payload[col.name] = v;
    }
    const r = await apiFetch(`/db-api/tables/${encodeURIComponent(currentTable)}`, 'POST', payload);
    if (r.error) errors.push(`Insert: ${r.error}`);
  }

  if (errors.length) {
    showToast('Errors: ' + errors.join(' | '), 'error');
  } else {
    showToast('Saved successfully', 'ok');
  }

  // Reload
  dirtyMap.clear();
  pendingDeletes.clear();
  pendingInserts = [];
  const fresh = await apiFetch(`/db-api/tables/${encodeURIComponent(currentTable)}`);
  allRows = fresh.rows || [];
  rebuildBody();
  updateToolbar();
  fetchCount(currentTable);

  btn.disabled = false;
  btn.textContent = 'Save Changes';
}

function discardChanges() {
  dirtyMap.clear();
  pendingDeletes.clear();
  pendingInserts = [];
  rebuildBody();
  updateDirtyBadge();
  updateToolbar();
}

// ── Add Row Modal ─────────────────────────────────────────────────────────────
function openAddModal() {
  const body = document.getElementById('modal-body');
  body.innerHTML = '';
  for (const col of columns) {
    const label = col.pk ? `${col.name} (PK — leave blank for auto)` : col.name;
    body.innerHTML += `
      <div class="field-row">
        <label>${esc(label)} <span style="color:var(--text-dim)">${esc(col.type||'ANY')}</span></label>
        <input data-col="${esc(col.name)}" type="text" placeholder="${col.dflt_value !== null ? 'default: '+col.dflt_value : 'NULL'}">
      </div>`;
  }
  document.getElementById('modal-overlay').classList.add('show');
  body.querySelector('input')?.focus();
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

function submitAddRow() {
  const data = {};
  document.querySelectorAll('#modal-body input[data-col]').forEach(inp => {
    if (inp.value !== '') data[inp.dataset.col] = inp.value;
  });
  const tempId = tempIdCounter--;
  pendingInserts.push({ tempId, data });
  closeModal();
  rebuildBody();
  updateDirtyBadge();
  // Scroll to bottom
  const wrap = document.getElementById('table-wrap');
  wrap.scrollTop = wrap.scrollHeight;
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function updateDirtyBadge() {
  const total = dirtyMap.size + pendingDeletes.size + pendingInserts.length;
  const badge = document.getElementById('dirty-count');
  badge.textContent = `${total} unsaved`;
  badge.classList.toggle('hidden', total === 0);
  document.getElementById('btn-save').disabled = total === 0;
  document.getElementById('btn-discard').disabled = total === 0;
}

function updateToolbar() {
  const title = document.getElementById('toolbar-title');
  if (currentTable) {
    title.innerHTML = `<span class="tbl-name">${esc(currentTable)}</span><span>${allRows.length} rows · ${columns.length} columns</span>`;
  }
  document.getElementById('btn-add').disabled = !currentTable;
  updateDirtyBadge();
}

function showLoading(on) {
  document.getElementById('loading').classList.toggle('show', on);
  document.getElementById('table-wrap').style.display = on ? 'none' : '';
  document.getElementById('placeholder').style.display = on || currentTable ? 'none' : '';
}

let toastTimer;
function showToast(msg, type = 'ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `show ${type}`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}

async function apiFetch(url, method = 'GET', body) {
  try {
    const opts = { method, headers: {} };
    if (body) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
    const r = await fetch(url, opts);
    return await r.json();
  } catch (e) {
    return { error: e.message };
  }
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}
</script>
